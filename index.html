<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Are You Feeling?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FFE94A; }
    .pw-wrap { font-family: 'Press Start 2P', monospace; background: #FFE94A; padding: 2rem 1.5rem; text-align: center; }
    .pw-title { font-size: 13px; color: #000; line-height: 1.9; margin-bottom: 1.5rem; }
    .pw-faces { display: flex; justify-content: center; gap: 18px; margin-bottom: 1.5rem; flex-wrap: nowrap; }
    .pw-face { cursor: pointer; transition: transform 0.1s; outline: none; background: none; border: none; padding: 0; }
    .pw-face:hover { transform: scale(1.12); }
    .pw-face:active { transform: scale(0.93); }
    .pw-face svg rect { shape-rendering: crispEdges; }
    .pw-label { font-size: 7px; color: #000; margin-top: 6px; display: block; }
    .pw-msg { font-size: 8px; color: #000; line-height: 2; opacity: 0; transition: opacity 0.35s; text-align: center; min-height: 2em; }
    .pw-msg.show { opacity: 1; }
  </style>
</head>
<body>
<div class="pw-wrap">
  <div class="pw-title">HOW ARE<br>YOU FEELING????</div>
  <div class="pw-faces">

    <button class="pw-face" onclick="showMsg('happy')" aria-label="Happy">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="0" width="8" height="1" fill="#000"/><rect x="2" y="1" width="2" height="1" fill="#000"/><rect x="12" y="1" width="2" height="1" fill="#000"/><rect x="1" y="2" width="1" height="1" fill="#000"/><rect x="14" y="2" width="1" height="1" fill="#000"/><rect x="0" y="3" width="1" height="10" fill="#000"/><rect x="15" y="3" width="1" height="10" fill="#000"/><rect x="1" y="13" width="1" height="1" fill="#000"/><rect x="14" y="13" width="1" height="1" fill="#000"/><rect x="2" y="14" width="2" height="1" fill="#000"/><rect x="12" y="14" width="2" height="1" fill="#000"/><rect x="4" y="15" width="8" height="1" fill="#000"/>
        <rect x="1" y="3" width="14" height="10" fill="#FFE94A"/><rect x="2" y="2" width="12" height="1" fill="#FFE94A"/><rect x="2" y="13" width="12" height="1" fill="#FFE94A"/>
        <rect x="4" y="5" width="2" height="2" fill="#000"/><rect x="10" y="5" width="2" height="2" fill="#000"/>
        <rect x="3" y="9" width="1" height="1" fill="#000"/><rect x="4" y="10" width="1" height="1" fill="#000"/><rect x="5" y="11" width="6" height="1" fill="#000"/><rect x="11" y="10" width="1" height="1" fill="#000"/><rect x="12" y="9" width="1" height="1" fill="#000"/>
      </svg>
      <span class="pw-label">happy</span>
    </button>

    <button class="pw-face" onclick="showMsg('sad')" aria-label="Sad">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="0" width="8" height="1" fill="#000"/><rect x="2" y="1" width="2" height="1" fill="#000"/><rect x="12" y="1" width="2" height="1" fill="#000"/><rect x="1" y="2" width="1" height="1" fill="#000"/><rect x="14" y="2" width="1" height="1" fill="#000"/><rect x="0" y="3" width="1" height="10" fill="#000"/><rect x="15" y="3" width="1" height="10" fill="#000"/><rect x="1" y="13" width="1" height="1" fill="#000"/><rect x="14" y="13" width="1" height="1" fill="#000"/><rect x="2" y="14" width="2" height="1" fill="#000"/><rect x="12" y="14" width="2" height="1" fill="#000"/><rect x="4" y="15" width="8" height="1" fill="#000"/>
        <rect x="1" y="3" width="14" height="10" fill="#FFE94A"/><rect x="2" y="2" width="12" height="1" fill="#FFE94A"/><rect x="2" y="13" width="12" height="1" fill="#FFE94A"/>
        <rect x="4" y="5" width="2" height="2" fill="#000"/><rect x="10" y="5" width="2" height="2" fill="#000"/>
        <rect x="4" y="11" width="1" height="1" fill="#000"/><rect x="5" y="10" width="1" height="1" fill="#000"/><rect x="6" y="9" width="4" height="1" fill="#000"/><rect x="10" y="10" width="1" height="1" fill="#000"/><rect x="11" y="11" width="1" height="1" fill="#000"/>
      </svg>
      <span class="pw-label">sad</span>
    </button>

    <button class="pw-face" onclick="showMsg('ok')" aria-label="OK">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="0" width="8" height="1" fill="#000"/><rect x="2" y="1" width="2" height="1" fill="#000"/><rect x="12" y="1" width="2" height="1" fill="#000"/><rect x="1" y="2" width="1" height="1" fill="#000"/><rect x="14" y="2" width="1" height="1" fill="#000"/><rect x="0" y="3" width="1" height="10" fill="#000"/><rect x="15" y="3" width="1" height="10" fill="#000"/><rect x="1" y="13" width="1" height="1" fill="#000"/><rect x="14" y="13" width="1" height="1" fill="#000"/><rect x="2" y="14" width="2" height="1" fill="#000"/><rect x="12" y="14" width="2" height="1" fill="#000"/><rect x="4" y="15" width="8" height="1" fill="#000"/>
        <rect x="1" y="3" width="14" height="10" fill="#FFE94A"/><rect x="2" y="2" width="12" height="1" fill="#FFE94A"/><rect x="2" y="13" width="12" height="1" fill="#FFE94A"/>
        <rect x="4" y="5" width="2" height="2" fill="#000"/><rect x="10" y="5" width="2" height="2" fill="#000"/>
        <rect x="4" y="10" width="8" height="1" fill="#000"/>
      </svg>
      <span class="pw-label">ok</span>
    </button>

    <button class="pw-face" onclick="showMsg('idk')" aria-label="IDK">
      <svg width="64" height="64" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="0" width="8" height="1" fill="#000"/><rect x="2" y="1" width="2" height="1" fill="#000"/><rect x="12" y="1" width="2" height="1" fill="#000"/><rect x="1" y="2" width="1" height="1" fill="#000"/><rect x="14" y="2" width="1" height="1" fill="#000"/><rect x="0" y="3" width="1" height="10" fill="#000"/><rect x="15" y="3" width="1" height="10" fill="#000"/><rect x="1" y="13" width="1" height="1" fill="#000"/><rect x="14" y="13" width="1" height="1" fill="#000"/><rect x="2" y="14" width="2" height="1" fill="#000"/><rect x="12" y="14" width="2" height="1" fill="#000"/><rect x="4" y="15" width="8" height="1" fill="#000"/>
        <rect x="1" y="3" width="14" height="10" fill="#FFE94A"/><rect x="2" y="2" width="12" height="1" fill="#FFE94A"/><rect x="2" y="13" width="12" height="1" fill="#FFE94A"/>
        <rect x="4" y="4" width="1" height="1" fill="#000"/><rect x="5" y="5" width="1" height="1" fill="#000"/><rect x="10" y="4" width="1" height="1" fill="#000"/><rect x="11" y="5" width="1" height="1" fill="#000"/><rect x="4" y="5" width="1" height="1" fill="#000"/><rect x="11" y="4" width="1" height="1" fill="#000"/>
        <rect x="5" y="9" width="2" height="1" fill="#000"/><rect x="9" y="9" width="2" height="1" fill="#000"/><rect x="6" y="10" width="1" height="1" fill="#000"/><rect x="7" y="11" width="2" height="1" fill="#000"/><rect x="9" y="10" width="1" height="1" fill="#000"/>
      </svg>
      <span class="pw-label">idk</span>
    </button>

  </div>
  <p class="pw-msg" id="pw-msg"></p>
</div>

<script>
var msgs = {
  happy: ["That joy you're carrying? It's contagious. Share it freely.","Good energy is a gift — to yourself and everyone around you.","You're glowing and it shows. Keep riding this wave.","Happiness looks good on you. Let it linger.","Your light is doing something real in the world today.","This is a good day. You made it one.","Whatever got you here — hold onto that feeling.","You're in it right now. Breathe it in."],
  sad: ["Feeling this is brave. You don't have to rush through it.","Heavy days remind you how strong you actually are.","You are allowed to not be okay. You're still worthy of good things.","Even on the grey days, you matter — deeply.","This feeling is temporary. Your resilience isn't.","Sadness doesn't make you broken. It makes you human.","Be gentle with yourself today. You deserve that kindness.","It's okay to rest. You don't have to hold it all together right now."],
  ok: ["Steady is underrated. You're doing just fine.","Middle ground is a real place. You're allowed to be here.","Not every day needs to be extraordinary. Today counts too.","Ok is honest. That's something.","You're showing up. That's more than enough.","In-between days carry their own quiet kind of beauty.","Neutral is not nothing. You're still here, still going.","Calm, consistent you — is a version worth appreciating."],
  idk: ["Not knowing is the start of something interesting.","Uncertainty means you're still open. That's a good thing.","Even when nothing feels clear, you're exactly where you need to be.","Let yourself wander a little. The answer usually finds you.","Not every feeling needs a label. Sit with it.","You don't have to figure it all out today.","The fact that you showed up, even uncertain, says a lot.","Mystery is just a story you haven't finished yet."]
};
var last = {};
function showMsg(mood) {
  var pool = msgs[mood];
  var i;
  do { i = Math.floor(Math.random() * pool.length); } while (i === last[mood] && pool.length > 1);
  last[mood] = i;
  var el = document.getElementById('pw-msg');
  el.classList.remove('show');
  setTimeout(function() { el.textContent = pool[i]; el.classList.add('show'); }, 200);
}
</script>
</body>
</html>
